# BERTopic Topic Modeling Environment
# Optimized for memory-constrained systems (e.g., Arch Linux deployment)
#
# Key optimizations:
# 1. Removed pytorch channel (use conda-forge for consistency)
# 2. Minimal version constraints to reduce solver memory usage
# 3. Commented out optional packages (install via pip after if needed)
# 4. Use pip section for adapters (not in conda)
#
# Installation tips:
# - Use mamba for 10-100x faster solving: mamba env create -f environment_bertopic.yml
# - Or use libmamba solver: conda config --set solver libmamba
# - For systems with <8GB RAM, use the staged installation method (see README_ENVIRONMENT.md)
#
name: bertopic
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10
  
  # Core scientific computing
  - numpy<2.0.0
  - pandas
  - scipy
  
  # Machine Learning - PyTorch with MPS/CUDA support
  # Using conda-forge for consistency (avoid pytorch channel mixing)
  - pytorch
  - torchvision
  - torchaudio
  
  # NLP and Embeddings
  - sentence-transformers
  - transformers
  - tokenizers
  
  # NOTE: adapters library is not available via conda
  # Install via pip after environment creation for SPECTER2 support:
  # pip install adapters>=0.2.1
  # The adapters library requires PyTorch (already included above)
  
  # Topic Modeling
  - bertopic
  - umap-learn
  - hdbscan
  
  # Text Processing
  - spacy
  - nltk
  - gensim
  - langdetect
  
  # Dimensionality Reduction & Clustering
  - scikit-learn
  
  # Visualization
  - matplotlib
  - plotly
  - python-kaleido
  
  # Data Handling
  - pymongo
  - pymilvus
  - pyarrow
  
  # Utilities
  - tqdm
  - psutil
  - joblib
  
  # Jupyter
  - jupyter
  - jupyterlab
  - ipywidgets
  - notebook
  
  # Development tools (optional but recommended)
  # Install separately if needed to avoid solver conflicts:
  # conda install -n bertopic black flake8 pylint mypy
  # - black
  # - flake8
  # - pylint
  # - mypy
  
  # Install adapters via pip (not available in conda)
  - pip
  - pip:
    # Uncomment to install adapters automatically
    # - adapters>=0.2.1

# Post-installation instructions:
# After creating the environment, run:
# 1. conda activate bertopic
# 2. python -m spacy download en_core_web_sm
# 3. python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords')"
# 4. (Optional) For SPECTER2 model support: pip install adapters>=0.2.1
# 5. Verify GPU: python -c "import torch; print(f'CUDA available: {torch.cuda.is_available()}'); print(f'MPS available: {torch.backends.mps.is_available()}')"

# Note on GPU Support:
# - CUDA: For NVIDIA GPUs on Linux/Windows
# - MPS: For Apple Silicon (M1/M2/M3) on macOS
# - PyTorch automatically selects the appropriate backend
# - The adapters library fully supports both CUDA and MPS through PyTorch
